spring:
  application:
    name: swiftcart
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${spring.application.name}}
    username: ${SPRING_DATASOURCE_USERNAME:tushar}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  cache:
    type: redis
app:
  security:
    auth:
      provider:
        google:
          client-id: ${APP_SECURITY_AUTH_PROVIDER_GOOGLE_CLIENT_ID}
      access-token:
        expiration-minutes: 15
        secret-key: ${APP_SECURITY_AUTH_ACCESS_TOKEN_SECRET_KEY}
      refresh-token:
        expiration-days: 30
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  firebase:
    config-path: ${APP_FIREBASE_CONFIG_PATH}
  shipping:
    flat-rate: 70
    free-threshold: 999
  product:
      images-dir: ${APP_PRODUCT_IMAGES_DIR:/app/uploads}
server:
  forward-headers-strategy: framework
logging:
  level:
    org:
      springframework:
        security: ${LOGGING_LEVEL_SPRING_SECURITY:TRACE}
management:
  endpoints:
    web:
      exposure:
        include: 'health,info,metrics'
